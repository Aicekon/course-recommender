<!DOCTYPE html>
<html>
<head>
    <title>Выбор тегов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header">
                        <h3 class="text-center">Выберите теги для тестирования</h3>
                    </div>
                    <div class="card-body">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }}">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}
                        <form method="POST">
                            <div class="row">
                                {% for tag in tags %}
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="tags" value="{{ tag }}" id="tag{{ loop.index }}">
                                        <label class="form-check-label" for="tag{{ loop.index }}">
                                            {{ tag }}
                                        </label>
                                    </div>
                                </div>
                                {% endfor %}
                            </div>
                            <div class="mt-4 d-flex justify-content-between">
                                <button type="submit" class="btn btn-primary">Начать тест</button>
                                <a href="{{ url_for('logout') }}" class="btn btn-outline-danger">Выйти</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
