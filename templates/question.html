<!DOCTYPE html>
<html>
<head>
    <title>Вопрос {{ question_num }}/{{ total }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Вопрос {{ question_num }} из {{ total }}</span>
                        <span class="badge bg-secondary">{{ question.tag }}</span>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title mb-4">{{ question.question_text }}</h5>
                        <form method="POST" action="{{ url_for('process_answer') }}" id="answer-form">
                            <div class="list-group mb-3">
                                {% for answer in answers %}
                                <label class="list-group-item">
                                    <input type="checkbox" name="answers" value="{{ answer[3] }}"
                                           class="form-check-input me-2">
                                    {{ answer[1] }}
                                </label>
                                {% endfor %}
                            </div>
                            <button type="submit" class="btn btn-primary" id="submit-btn">Ответить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('answer-form').addEventListener('submit', function(e) {
            const checkboxes = document.querySelectorAll('input[name="answers"]:checked');
            if (checkboxes.length === 0) {
                e.preventDefault();
                alert('Пожалуйста, выберите хотя бы один ответ');
            }
        });
    </script>
</body>
</html>
